# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

# Puste akcje kontrolerów (`def edit; end`) w jednej linii zamiast dwóch —
# omakase wyłącza ten cop, my go włączamy, żeby nie trzymać obu wariantów.
Style/EmptyMethod:
  Enabled: true
  EnforcedStyle: compact
