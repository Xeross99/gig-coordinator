<!doctype html>

<html lang="pl">

  <head>

    <title>Nie znaleziono strony (404 Not Found)</title>

    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">

    <style>

      *, *::before, *::after {
        box-sizing: border-box;
      }

      * {
        margin: 0;
      }

      html {
        font-size: 16px;
      }

      body {
        background: #FFF;
        color: #261B23;
        display: grid;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Aptos, Roboto, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        font-size: clamp(1rem, 2.5vw, 2rem);
        -webkit-font-smoothing: antialiased;
        font-style: normal;
        font-weight: 400;
        letter-spacing: -0.0025em;
        line-height: 1.4;
        min-height: 100dvh;
        place-items: center;
        text-rendering: optimizeLegibility;
        -webkit-text-size-adjust: 100%;
      }

      .error-description {
        color: #d30001;
      }

      .error-id {
        color: #f0eff0;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #101010;
          color: #e0e0e0;
        }

        .error-description {
          color: #FF6161;
        }

        .error-id {
          color: #2c2c2c;
        }
      }

      a {
        color: inherit;
        font-weight: 700;
        text-decoration: underline;
        text-underline-offset: 0.0925em;
      }

      b, strong {
        font-weight: 700;
      }

      i, em {
        font-style: italic;
      }

      main {
        display: grid;
        gap: 1em;
        padding: 2em;
        place-items: center;
        text-align: center;
      }

      /* Numer nad opisem. Wcześniej był tu SVG, w którym opis był krzywymi
         (literami zamienionymi na ścieżki), więc nie dawał się przetłumaczyć.
         Rails nakładał opis na cyfrę, ale to działa tylko przy krótkich
         angielskich etykietach — „Nieobsługiwana przeglądarka" zawija się na
         telefonie do dwóch linii i zasłania numer. Stąd układ pionowy. */
      main header {
        display: grid;
        gap: 0.15em;
        place-items: center;
        width: min(100%, 20em);
      }

      .error-id {
        font-size: 4em;
        font-weight: 700;
        letter-spacing: -0.05em;
        line-height: 1;
      }

      .error-description {
        font-size: 0.9em;
        font-weight: 700;
        text-align: center;
      }

      main article {
        width: min(100%, 30em);
      }

      main article p {
        font-size: 75%;
      }

      main article br {
        display: none;

        @media(min-width: 48em) {
          display: inline;
        }
      }

    </style>

  </head>

  <body>

    <!-- This file lives in public/404.html -->

    <main>
      <header>
        <p class="error-id">404</p>
        <p class="error-description">Nie znaleziono</p>
      </header>
      <article>
        <p><strong>Strona, której szukasz, nie istnieje.</strong> Możliwe, że adres jest błędny albo strona została przeniesiona.</p>
      </article>
    </main>

  </body>

</html>
