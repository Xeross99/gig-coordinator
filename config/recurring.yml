production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  purge_unattached_active_storage_blobs:
    command: "ActiveStorage::Blob.unattached.where(created_at: ..7.days.ago).find_each(&:purge_later)"
    schedule: every day at 3am
  event_completion:
    class: EventCompletionJob
    schedule: every 5 minutes
  database_backup:
    class: Maintenance::DatabaseBackupJob
    schedule: every day at 4am
  push_subscription_prune:
    class: PushSubscriptionPruneJob
    schedule: every day at 5am

development:
  event_completion:
    class: EventCompletionJob
    schedule: every 5 minutes
